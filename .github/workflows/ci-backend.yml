name: CI Backend & DevSecOps

on:
  push:
    branches: [ main ]
    paths:
      - 'app/backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # 1. Test & Quality Check
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  # 2. Security Scan with Trivy (Vulnerability Scanning)
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy FS Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app/backend'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Ghi 1 nếu muốn chặn build khi có lỗ hổng nghiêm trọng

  # 3. Build & Push Docker Image
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TỰ ĐỘNG CẬP NHẬT TAG CONTAINER MỚI VÀO PRODUCTION GITOPS REPOSITORY
      - name: Auto-Update Image Tag in GitOps Repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Promoting new backend image tag: sha-${SHORT_SHA} to GitOps repository..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone repo GitOps
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/baongdqu/project-devops-gitops.git gitops-repo
          cd gitops-repo

          # Cập nhật tag mới vào cả môi trường dev và prod (kustomization.yaml)
          sed -i "s|ghcr.io/baongdqu/project-devops-webserver/backend:.*|ghcr.io/baongdqu/project-devops-webserver/backend\n    newTag: sha-${SHORT_SHA}|g" k8s/manifests/overlays/dev/kustomization.yaml
          sed -i "s|ghcr.io/baongdqu/project-devops-webserver/backend:.*|ghcr.io/baongdqu/project-devops-webserver/backend\n    newTag: sha-${SHORT_SHA}|g" k8s/manifests/overlays/prod/kustomization.yaml

          # Commit & Push sang GitOps repo
          git add k8s/manifests/overlays/
          git diff --staged --quiet || (git commit -m "chore(gitops): auto-deploy backend sha-${SHORT_SHA} to dev & prod [skip ci]" && git push origin main)

