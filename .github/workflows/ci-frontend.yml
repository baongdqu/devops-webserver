name: CI Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'app/frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/frontend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Check
        run: npm run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TỰ ĐỘNG CẬP NHẬT TAG CONTAINER FRONTEND MỚI VÀO PRODUCTION GITOPS REPOSITORY
      - name: Auto-Update Frontend Image Tag in GitOps Repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "Promoting new frontend image tag: sha-${SHORT_SHA} to GitOps repository..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone repo GitOps
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/baongdqu/devops-gitops.git gitops-repo
          cd gitops-repo

          # Cập nhật tag mới vào cả môi trường dev và prod (kustomization.yaml)
          sed -i "s|ghcr.io/baongdqu/devops-webserver/frontend:.*|ghcr.io/baongdqu/devops-webserver/frontend\n    newTag: sha-${SHORT_SHA}|g" k8s/manifests/overlays/dev/kustomization.yaml
          sed -i "s|ghcr.io/baongdqu/devops-webserver/frontend:.*|ghcr.io/baongdqu/devops-webserver/frontend\n    newTag: sha-${SHORT_SHA}|g" k8s/manifests/overlays/prod/kustomization.yaml

          # Commit & Push sang GitOps repo
          git add k8s/manifests/overlays/
          git diff --staged --quiet || (git commit -m "chore(gitops): auto-deploy frontend sha-${SHORT_SHA} to dev & prod [skip ci]" && git push origin main)

